<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AlphaMan</title>
<meta name="description" content="AlphaMan (1995), the DOS roguelike by Jeffrey R. Olson, ported to the browser.">
<style>
  :root {
    --bg: #101014;
    --panel: #1b1b22;
    --text: #d7d7df;
    --muted: #8b8b99;
    --accent: #55ffff;
    --danger: #ff6b6b;
    --border: #2e2e3a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px;
    background: var(--bg); color: var(--text);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; align-items: center; gap: 16px;
  }
  #game { width: 100%; max-width: 1080px; }
  /* With the 3D view on, the minimap sits to the left of the game screen. */
  #game.with-minimap { max-width: calc(1080px + var(--minimap-width) + 12px); }
  :root { --minimap-width: 260px; }
  #playarea { display: flex; gap: 12px; align-items: flex-start; }
  #playarea > #viewport { flex: 1; min-width: 0; }
  #minimap {
    flex: none; width: var(--minimap-width); height: auto;
    image-rendering: pixelated; background: #000; border: 1px solid var(--border);
  }
  #minimap[hidden] { display: none; }
  #viewport { position: relative; border: 1px solid var(--border); background: #000; }
  #screenbox { position: relative; }
  /* Full screen: the game screen (and the minimap, with the 3D view) scaled
     up as far as it fits, centred on black. */
  #playarea:fullscreen {
    --mm: 0px;
    align-items: center; justify-content: center;
    width: 100vw; height: 100vh; background: #000; gap: 1vw;
  }
  #playarea.with-minimap:fullscreen { --mm: calc(var(--minimap-width) + 1vw); }
  #playarea:fullscreen > #viewport {
    flex: none; border: 0;
    width: min(calc(100vw - var(--mm)), calc((100vh - 2em) * 720 / 400));
  }
  #screen {
    display: block; width: 100%; height: auto;
    image-rendering: pixelated; background: #000;
  }
  /* The 3D view covers the map: columns 1-52 and rows 1-22 of 80 x 25. */
  #screen3d {
    position: absolute; left: 0; top: 0;
    width: calc(100% * 52 / 80); height: calc(100% * 22 / 25);
    display: none;
  }
  #controls, #view3d-controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  #controls { margin-top: 8px; }
  #view3d-controls select {
    font: inherit; color: var(--text); background: #2a2a36;
    border: 1px solid var(--border); border-radius: 4px; padding: 3px 6px;
  }
  #view3d-controls .hint { color: var(--muted); font-size: 13px; }
  #view3d-controls label { display: flex; align-items: center; gap: 4px; cursor: pointer; }
  #status { margin: 0; padding: 4px 8px; color: var(--accent); background: #000; text-align: center; }
  #status:empty { display: none; }
  #saves {
    width: 100%; max-width: 1080px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 6px;
    padding: 12px 16px;
  }
  #saves h2 { font-size: 16px; margin: 0 0 8px; }
  #save-list { list-style: none; margin: 0 0 12px; padding: 0; }
  #save-list li {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 6px 0; border-bottom: 1px solid var(--border);
  }
  #save-list li.empty { color: var(--muted); }
  .save-name { font-family: ui-monospace, Consolas, monospace; font-weight: 600; min-width: 9ch; }
  .save-info { color: var(--muted); flex: 1; }
  button, label.button {
    font: inherit; color: var(--text); background: #2a2a36;
    border: 1px solid var(--border); border-radius: 4px; padding: 4px 12px; cursor: pointer;
  }
  button:hover, label.button:hover { border-color: var(--accent); }
  button:disabled { opacity: 0.5; cursor: default; }
  button.danger:hover { border-color: var(--danger); color: var(--danger); }
  #save-upload { position: absolute; left: -9999px; }
  #save-message { color: var(--muted); margin: 8px 0 0; min-height: 1.45em; }
  footer { max-width: 1080px; color: var(--muted); font-size: 13px; }
  footer a { color: var(--accent); }
</style>
</head>
<body>
<main id="game">
  <div id="playarea">
  <canvas id="minimap" width="468" height="352" hidden aria-label="Minimap: the 2D map"></canvas>
  <div id="viewport">
    <div id="screenbox">
      <canvas id="screen" width="720" height="400" aria-label="AlphaMan game screen"></canvas>
    </div>
    <p id="status" role="status"></p>
  </div>
  </div>
  <div id="controls">
    <button id="fullscreen" type="button">Full screen (Alt+Enter)</button>
    <span id="view3d-controls"></span>
  </div>
</main>

<section id="saves" aria-labelledby="saves-title">
  <h2 id="saves-title">Saved games</h2>
  <ul id="save-list"></ul>
  <label class="button" for="save-upload">Upload saved game…</label>
  <input id="save-upload" type="file" accept=".zip,.alf,.sav" multiple>
  <p id="save-message" role="status"></p>
</section>

<footer>
  AlphaMan &copy; 1995 Jeffrey R. Olson (MIT licence). Browser port of the
  original QuickBasic and C source. Saved games are kept in this browser; download
  them to keep a copy. Font: VGA 9&times;16 from pcface (CC BY-SA 4.0).
</footer>

<script src="js/data.js"></script>
<script src="js/runtime/font.js"></script>
<script src="js/runtime/qb.js"></script>
<script src="js/runtime/screen.js"></script>
<script src="js/runtime/keyboard.js"></script>
<script src="js/runtime/files.js"></script>
<script src="js/runtime/io.js"></script>
<script src="js/alpclib.js"></script>
<script src="js/game/state.js"></script>
<script src="js/game/a1.js"></script>
<script src="js/game/a2.js"></script>
<script src="js/game/a3.js"></script>
<script src="js/game/a4.js"></script>
<script src="js/game/a5.js"></script>
<script src="js/game/a6.js"></script>
<script src="js/game/a7.js"></script>
<script src="js/game/a8.js"></script>
<script src="js/savepanel.js"></script>
<script src="js/main.js"></script>

<!-- The optional 3D view (js/view3d/) reads the game and draws it with three.js;
     the game above runs the same with or without it. -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module" src="js/view3d/main3d.js"></script>
</body>
</html>
