# Runs the touch control tests (tools/test-touch.mjs) in Chromium, sideways
# and upright, on every push to main and on pull requests.  This is a
# separate workflow from the Pages deploy, so a failure here does not stop a
# deploy.  (To make it blocking later, run it as a job in pages.yml that the
# deploy job needs, or require this check in the branch protection rules.)
name: Touch control tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  touch-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Both at once: a second npm install would remove the first.
      - name: Install Playwright, Chromium and eslint
        run: |
          npm install --no-save --no-package-lock playwright@1 eslint@10
          npx playwright install --with-deps chromium

      - name: Lint and async checks
        run: |
          node tools/lint.mjs
          node tools/check-async.mjs

      - name: Touch control tests
        env:
          TEST_SHOTS: ${{ runner.temp }}/touch-shots
        run: |
          mkdir -p "$TEST_SHOTS"
          node tools/test-touch.mjs

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: touch-screenshots
          path: ${{ runner.temp }}/touch-shots
          if-no-files-found: ignore
