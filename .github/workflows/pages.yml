# Publishes the browser version of AlphaMan to GitHub Pages on every push to
# main.  In the repository settings, Pages > Build and deployment > Source
# must be set to "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check that js/data.js is up to date
        run: |
          node tools/build-data.mjs
          git diff --exit-code js/data.js

      - name: Check for async calls without await
        run: node tools/check-async.mjs

      - name: Assemble the site
        run: |
          mkdir _site
          cp -r index.html js LICENSE _site/
          # Give every script URL the commit as a version, so browsers never
          # mix a new page with cached scripts from an older one.
          v="${GITHUB_SHA::8}"
          sed -i -E "s#(src=\"js/[^\"]+\.js)\"#\1?v=$v\"#g" _site/index.html
          sed -i -E "s#(from '\./[^']+\.js)'#\1?v=$v'#g" _site/js/view3d/*.js
          grep -c "?v=$v" _site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
